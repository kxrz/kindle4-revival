<svg xmlns="http://www.w3.org/2000/svg" width="756" height="221" viewBox="0 0 756 221" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
<rect width="756" height="221" rx="10" fill="#1e1f24"/>
<rect width="756" height="34" rx="10" fill="#2a2b31"/>
<rect y="24" width="756" height="10" fill="#2a2b31"/>
<circle cx="20" cy="17" r="6" fill="#ff5f57"/>
<circle cx="40" cy="17" r="6" fill="#febc2e"/>
<circle cx="60" cy="17" r="6" fill="#28c840"/>
<text x="378" y="22" fill="#9b9ba3" text-anchor="middle" font-size="13">kindle4-revival</text>
<text x="18" y="58" xml:space="preserve"><tspan fill="#7dd3fc">$ </tspan><tspan fill="#f4f4f5" font-weight="600">brew install zstd</tspan></text>
<text x="18" y="78" xml:space="preserve"><tspan fill="#7dd3fc">$ </tspan><tspan fill="#f4f4f5" font-weight="600">for d in fr-fr en-fr; do</tspan></text>
<text x="18" y="98" xml:space="preserve"><tspan fill="#7dd3fc">> </tspan><tspan fill="#f4f4f5" font-weight="600">  mkdir -p /Volumes/Kindle/koreader/data/dict/$d</tspan></text>
<text x="18" y="118" xml:space="preserve"><tspan fill="#7dd3fc">> </tspan><tspan fill="#f4f4f5" font-weight="600">  zstd -dc files/$d.tar.zst | tar xf - -C /Volumes/Kindle/koreader/data/dict/$d</tspan></text>
<text x="18" y="138" xml:space="preserve"><tspan fill="#7dd3fc">> </tspan><tspan fill="#f4f4f5" font-weight="600">done</tspan></text>
<text x="18" y="158" xml:space="preserve"><tspan fill="#7dd3fc">$ </tspan><tspan fill="#f4f4f5" font-weight="600">du -sh /Volumes/Kindle/koreader/data/dict/*</tspan></text>
<text x="18" y="178" fill="#d4d4d8" xml:space="preserve"> 24M    /Volumes/Kindle/koreader/data/dict/en-fr</text>
<text x="18" y="198" fill="#d4d4d8" xml:space="preserve">197M    /Volumes/Kindle/koreader/data/dict/fr-fr</text>
</svg>