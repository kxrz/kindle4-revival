<svg xmlns="http://www.w3.org/2000/svg" width="1121" height="181" viewBox="0 0 1121 181" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
<rect width="1121" height="181" rx="10" fill="#1e1f24"/>
<rect width="1121" height="34" rx="10" fill="#2a2b31"/>
<rect y="24" width="1121" height="10" fill="#2a2b31"/>
<circle cx="20" cy="17" r="6" fill="#ff5f57"/>
<circle cx="40" cy="17" r="6" fill="#febc2e"/>
<circle cx="60" cy="17" r="6" fill="#28c840"/>
<text x="560" y="22" fill="#9b9ba3" text-anchor="middle" font-size="13">kindle4-revival</text>
<text x="18" y="58" xml:space="preserve"><tspan fill="#7dd3fc">$ </tspan><tspan fill="#f4f4f5" font-weight="600">cp tools/fix-kual-booklet/runme.sh /Volumes/Kindle/runme.sh</tspan></text>
<text x="18" y="78" xml:space="preserve"><tspan fill="#7dd3fc">$ </tspan><tspan fill="#f4f4f5" font-weight="600">cp -R files/k4-jailbreak/data.tar.gz files/k4-jailbreak/ENABLE_DIAGS files/k4-jailbreak/diagnostic_logs /Volumes/Kindle/</tspan></text>
<text x="18" y="98" xml:space="preserve"><tspan fill="#7dd3fc">$ </tspan><tspan fill="#f4f4f5" font-weight="600">diskutil eject /Volumes/Kindle</tspan></text>
<text x="18" y="118" fill="#d4d4d8" xml:space="preserve">Disk /Volumes/Kindle ejected</text>
<text x="18" y="138" fill="#8b8b94" xml:space="preserve"># ... run the jailbreak again (Restart, D, R, left), then plug the Kindle back in:</text>
<text x="18" y="158" xml:space="preserve"><tspan fill="#7dd3fc">$ </tspan><tspan fill="#f4f4f5" font-weight="600">rm /Volumes/Kindle/runme.sh</tspan></text>
</svg>