<svg xmlns="http://www.w3.org/2000/svg" width="961" height="281" viewBox="0 0 961 281" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
<rect width="961" height="281" rx="10" fill="#1e1f24"/>
<rect width="961" height="34" rx="10" fill="#2a2b31"/>
<rect y="24" width="961" height="10" fill="#2a2b31"/>
<circle cx="20" cy="17" r="6" fill="#ff5f57"/>
<circle cx="40" cy="17" r="6" fill="#febc2e"/>
<circle cx="60" cy="17" r="6" fill="#28c840"/>
<text x="480" y="22" fill="#9b9ba3" text-anchor="middle" font-size="13">kindle4-revival</text>
<text x="18" y="58" xml:space="preserve"><tspan fill="#7dd3fc">$ </tspan><tspan fill="#f4f4f5" font-weight="600">cd files</tspan></text>
<text x="18" y="78" xml:space="preserve"><tspan fill="#7dd3fc">$ </tspan><tspan fill="#f4f4f5" font-weight="600">unzip K4-Jailbreak.zip -d k4-jailbreak</tspan></text>
<text x="18" y="98" fill="#d4d4d8" xml:space="preserve">Archive:  K4-Jailbreak.zip</text>
<text x="18" y="118" fill="#d4d4d8" xml:space="preserve">  inflating: k4-jailbreak/data.tar.gz  </text>
<text x="18" y="138" fill="#d4d4d8" xml:space="preserve">   creating: k4-jailbreak/diagnostic_logs</text>
<text x="18" y="158" fill="#d4d4d8" xml:space="preserve"> extracting: k4-jailbreak/diagnostic_logs/device_info.xml  </text>
<text x="18" y="178" fill="#d4d4d8" xml:space="preserve">  inflating: k4-jailbreak/Update_jailbreak_1.8.N_uninstall.bin  </text>
<text x="18" y="198" fill="#d4d4d8" xml:space="preserve"> extracting: k4-jailbreak/ENABLE_DIAGS  </text>
<text x="18" y="218" xml:space="preserve"><tspan fill="#7dd3fc">$ </tspan><tspan fill="#f4f4f5" font-weight="600">cp -R k4-jailbreak/data.tar.gz k4-jailbreak/ENABLE_DIAGS k4-jailbreak/diagnostic_logs /Volumes/Kindle/</tspan></text>
<text x="18" y="238" xml:space="preserve"><tspan fill="#7dd3fc">$ </tspan><tspan fill="#f4f4f5" font-weight="600">diskutil eject /Volumes/Kindle</tspan></text>
<text x="18" y="258" fill="#d4d4d8" xml:space="preserve">Disk /Volumes/Kindle ejected</text>
</svg>